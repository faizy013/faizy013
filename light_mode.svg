<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="480" viewBox="0 0 860 480" font-family="'Courier New', monospace">
  <style>
    .bg     { fill: #ffffff; }
    .border { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .head   { fill: #0969da; font-size: 16px; font-weight: bold; }
    .rule   { fill: #d0d7de; font-size: 13px; }
    .bullet { fill: #8c959f; font-size: 13px; }
    .label  { fill: #0a7c86; font-size: 13px; }
    .value  { fill: #24292f; font-size: 13px; }
    .avatar-ring { fill: none; stroke: #0969da; stroke-width: 2; }
  </style>

  <rect class="bg" width="860" height="480" rx="10"/>
  <rect class="border" x="0.5" y="0.5" width="859" height="479" rx="10"/>

  <!-- Avatar column -->
  <defs>
    <clipPath id="avatarClipLight">
      <circle cx="175" cy="240" r="120"/>
    </clipPath>
  </defs>
  <image href="https://github.com/faizy013.png?size=400" xlink:href="https://github.com/faizy013.png?size=400" x="55" y="120" width="240" height="240" clip-path="url(#avatarClipLight)" preserveAspectRatio="xMidYMid slice"/>
  <circle class="avatar-ring" cx="175" cy="240" r="120"/>

  <!-- Divider -->
  <line x1="350" y1="30" x2="350" y2="450" stroke="#d0d7de" stroke-width="1"/>

  <!-- Header -->
  <text x="375" y="40" class="head">faizi@faizy013</text>
  <text x="375" y="58" class="rule">─────────────────────────────────────────</text>

  <!-- System info block (EDIT THESE VALUES TO MATCH YOU) -->
  <text x="375" y="82" class="bullet">.</text>
  <text x="392" y="82" class="label">OS:</text>
  <text x="835" y="82" class="value" text-anchor="end">Ubuntu 22.04</text>

  <text x="375" y="106" class="bullet">.</text>
  <text x="392" y="106" class="label">Host:</text>
  <text x="835" y="106" class="value" text-anchor="end">Frappe / ERPNext Developer</text>

  <text x="375" y="130" class="bullet">.</text>
  <text x="392" y="130" class="label">Location:</text>
  <text x="835" y="130" class="value" text-anchor="end">Lahore, Pakistan</text>

  <text x="375" y="154" class="bullet">.</text>
  <text x="392" y="154" class="label">Shell:</text>
  <text x="835" y="154" class="value" text-anchor="end">Claude Code, Git, GitHub Actions</text>

  <text x="375" y="178" class="bullet">.</text>
  <text x="392" y="178" class="label">Education:</text>
  <text x="835" y="178" class="value" text-anchor="end">EDIT_ME</text>

  <text x="375" y="204" class="bullet">.</text>
  <text x="392" y="204" class="label">Languages.Programming:</text>
  <text x="835" y="204" class="value" text-anchor="end">Python, JavaScript, HTML/CSS</text>

  <text x="375" y="228" class="bullet">.</text>
  <text x="392" y="228" class="label">Languages.Real:</text>
  <text x="835" y="228" class="value" text-anchor="end">EDIT_ME</text>

  <text x="375" y="254" class="bullet">.</text>
  <text x="392" y="254" class="label">Stack:</text>
  <text x="835" y="254" class="value" text-anchor="end">Frappe, ERPNext, REST APIs</text>

  <!-- Contact section -->
  <text x="375" y="286" class="label">Contact</text>
  <text x="450" y="286" class="rule">──────────────────────────────</text>

  <text x="375" y="310" class="bullet">.</text>
  <text x="392" y="310" class="label">Email:</text>
  <text x="835" y="310" class="value" text-anchor="end">EDIT_ME@example.com</text>

  <text x="375" y="334" class="bullet">.</text>
  <text x="392" y="334" class="label">GitHub:</text>
  <text x="835" y="334" class="value" text-anchor="end">github.com/faizy013</text>

  <!-- GitHub Stats section -->
  <text x="375" y="366" class="label">GitHub Stats</text>
  <text x="475" y="366" class="rule">──────────────────────────</text>

  <text x="375" y="390" class="bullet">.</text>
  <text x="392" y="390" class="label">Repos:</text>
  <text x="835" y="390" text-anchor="end">
    <tspan id="repo_data" class="value">12</tspan>
    <tspan class="label"> {Contributed: </tspan>
    <tspan id="contrib_data" class="value">45</tspan>
    <tspan class="label">}</tspan>
  </text>

  <text x="375" y="414" class="bullet">.</text>
  <text x="392" y="414" class="label">Commits:</text>
  <text x="835" y="414" text-anchor="end">
    <tspan id="commit_data" class="value">649</tspan>
    <tspan class="label">  |  Followers: </tspan>
    <tspan id="follower_data" class="value">0</tspan>
  </text>

  <text x="375" y="438" class="bullet">.</text>
  <text x="392" y="438" class="label">Lines of Code:</text>
  <text x="835" y="438" text-anchor="end">
    <tspan id="loc_data" class="value">324,859</tspan>
    <tspan class="label"> (</tspan>
    <tspan id="loc_add" fill="#1a7f37" class="value">380,795</tspan>
    <tspan class="label">++, </tspan>
    <tspan id="loc_del" fill="#cf222e" class="value">55,936</tspan>
    <tspan class="label">--)</tspan>
  </text>

  <!-- age_data kept off-screen so main.py's svg_overwrite call doesn't error; harmless if unused -->
  <text x="-9999" y="-9999" id="age_data">21 years, 10 months, 14 days</text>
</svg>